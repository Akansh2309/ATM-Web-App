{% extends 'base.html' %}
{% block content %}
<div class="statement-screen">
    <div class="dashboard-header">
        <h2>TRANSACTION HISTORY</h2>
        <a href="{{ url_for('dashboard') }}" class="btn btn-secondary btn-small">RETURN</a>
    </div>

    <table class="data-table">
        <thead>
            <tr>
                <th>DATE/TIME</th>
                <th>ACCOUNT</th>
                <th>TYPE</th>
                <th>AMOUNT</th>
            </tr>
        </thead>
        <tbody>
            {% for txn in transactions %}
            <tr>
                <td>{{ txn.timestamp }}</td>
                <td>{{ txn.account_id }}</td>
                <td>{{ txn.type }}</td>
                <td class="currency {% if txn.amount < 0 %}negative{% else %}positive{% endif %}">
                    ${{ "%.2f"|format(txn.amount|abs) }}
                </td>
            </tr>
            {% else %}
            <tr><td colspan="4">NO TRANSACTIONS FOUND</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
